    <rect x="14" y="4" width="4" height="7" rx="1"/>
    <rect x="23" y="4" width="4" height="7" rx="1"/>
    <rect x="32" y="4" width="4" height="7" rx="1"/>
    <rect x="41" y="4" width="4" height="7" rx="1"/>
    <rect x="14" y="53" width="4" height="7" rx="1"/>
    <rect x="23" y="53" width="4" height="7" rx="1"/>
    <rect x="32" y="53" width="4" height="7" rx="1"/>
    <rect x="41" y="53" width="4" height="7" rx="1"/>
    <rect x="4" y="18" width="7" height="4" rx="1"/>
    <rect x="4" y="27" width="7" height="4" rx="1"/>
    <rect x="4" y="36" width="7" height="4" rx="1"/>
