          大纲一律严禁具体到场景与发言，一律严禁台词、镜头、走位、演出指示；
          一律不得写入或预写 02-Script/、03-Asset/、04-ScreenPlay/、05-Game/ 等下游目录与文件。
        order: 31                                           # §2.1
        plugins:
