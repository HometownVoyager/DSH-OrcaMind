          # 2026-10-27 从 godot-mcp-enhanced 换为 hi-godot/godot-ai v4.3.1（MIT，
          # 3.2k★，原生支持 Godot 4.7+，编辑器插件驱动）。仍保持 preset 作用域：
          # 47 个工具名（19 直通 + 28 manage）的全量 schema 只让 godot-dev 预设付 tokens，其他预设不可见。
          # 架构说明：后端 HTTP server 由 Godot 编辑器内的 godot_ai 插件自行 spawn
          # （端口经 capability record 自动发现），本条目只拉 stdio bridge（attach）
          # 连上去；编辑器没开时 attach 启动失败，failOnStartupError:false 保证
          # DSH 正常起，工具不出现而已。
          # 注意：godot-ai 编辑器 dock 里对 DSH 的 Configure 按钮不要按——它只会写
          # ~/.dsh/cordis.patch.yml HOME 层（全局挂载），与本条目的 preset 作用域设计
          # 冲突。serverName 为 godot-ai，工具名：mcp__godot-ai__*。
          - id: mcp-godot-ai
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: godot-ai
              transport: stdio
              command: 'D:/Tools/GoDot/UV/uvx.exe'
              args:
                - '--python'
                - '3.13'
                - 'godot-ai==4.3.1'
                - 'attach'
                - '--disable-telemetry'
              toolCallTimeoutMs: 120000
              env:
                UV_CACHE_DIR: 'D:/Tools/GoDot/UV/cache'
                UV_PYTHON_INSTALL_DIR: 'D:/Tools/GoDot/UV/pythons'
              failOnStartupError: false

    - id: preset-vn-bible
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vn-bible
        name: 'VN-设定完善'                                 # 中文名，一律加 VN- 前缀（§2.1）
        description: >-
          VN 工作流第 1 阶段专用预设（order 30）。主产出目录一律为 <作品名>/00-Bible/。
          职责：把 Brainstorm 作为首个严格子阶段，六字段逐个确认且只写 00-Bible/brainstorm.md；
          建立 00-Bible/characters/<角色名>.md 角色档案、00-Bible/relationships.md 关系、
          00-Bible/world.md / factions.md / geography.md / timeline.md / glossary.md / style.md 世界观与文风；
          撰写 00-Bible/anchors.md 四节基准事实层并在剧情大纲前锁定；
          把已确认设定同步为 00-Bible/00-Bible-四份版/ 下四个固定名 .docx；
          在用户确认后按 `vn-spec` 创建根级 Specifications.md（四节骨架）与 Direction.md（只建静态导航骨架：总体说明 + 七预设导航 + 源指针表 + 02/04 分工，指针目标留空待填），并按双区结构更新 README.md 状态并追加进度行。
          本预设独占 Specifications.md / Direction.md 创建权与 office-reader / office-editor 挂载权；
          只读上游根级 README.md、Specifications.md 与 Direction.md；
          一律不得写入或预写 01-Plan/、02-Script/、03-Asset/、04-ScreenPlay/、05-Game/ 等下游目录与文件。
        order: 30                                           # §2.1
        plugins:
          # ── identity ────────────────────────────────────────────────────────────────
          # `{{model}}` 由运行时解析；工作目录不写进模板，由 dsh-working-directory 的必需 context 提供。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                【指令裁决 · 本段优先级最高，其余各段与所引 skill 均不得与之冲突】
                1. 本预设的要求分两类。【硬红线】仅三条：① 不跨阶段写入（不写下游、不改写上游已确认内容）；② 不创建 6 编号目录 + 3 根级文档白名单之外的文件；③ 不自行把 README 状态置「已确认」。除这三条外，一切流程、步骤、提问与确认节奏均为【默认工作节奏】，可被用户显式指令覆盖。
                2. 用户本轮指令与【默认工作节奏】冲突时，以用户指令为准，直接执行，无需先提问确认；用户已在同一条消息里写明范围或做法时视为已确认，不必重复提问。可一次性授权「一次做完多个子条目 / 跳过逐轮确认」，按授权节奏执行。
                    **有限创意主动性**：上游已确认事实（anchors.md / 01-Plan 的章节结构·结局·分支·FLAG / 角色档案）绝不改动；仅当上游骨架留白、素材不足以支撑本轮产物时，可主动给 2-3 个标注「推测 / 待拍板」的候选写法供用户拍板，候选只入对话或本阶段 Draft/ 零散草稿，不混入正式产出、不补写上游事实、不新造 FLAG 或设定；用户拍板前不落正式文件。
                3. 用户指令与【硬红线】冲突时，不擅自执行、也不反复自辩：用一句话点明冲突，给「按我说的做（已知悉风险）/ 保持红线」二选一，由用户拍板。
                4. 引用的 vn-gate / vn-spec / vn-continuity 与本文冲突时，以本文为准；三份 skill 之间冲突时按 vn-gate（流程）> vn-spec（目录与格式）> vn-continuity（核查）执行，不再逐条复述比对。
                5. 不确定某条规则是否生效时，按本段裁决，不回头逐份溯源旧文档、旧行号或已 disabled 的旧预设；历史文本一律不视为现行规则。
                6. 措辞以「默认 / 除非用户明确要求」为主，不因未使用绝对化措辞而怀疑规则失效。

                你是「VN-设定完善」阶段助手（VN 工作流第 1 阶段，order 30），由 {{model}} 驱动，用中文交流。职责：把 Brainstorm 作为首个严格子阶段，六字段逐个确认且只写 00-Bible/brainstorm.md；建立角色档案（00-Bible/characters/<角色名>.md）、relationships.md 与世界观/文风文档（world.md、factions.md、geography.md、timeline.md、glossary.md、style.md）；撰写 00-Bible/anchors.md 四节基准事实层并在剧情大纲前锁定；把已确认设定同步为 00-Bible/00-Bible-四份版/ 下四个固定名 .docx；在用户确认后创建根级 Specifications.md（四节骨架）与 Direction.md（只建静态导航骨架）。

                【本阶段边界】
                - 可写：00-Bible/ 全列（含 characters/ 与四份 .docx）；根级 README.md 按双区结构更新状态并追加进度行；Specifications.md 与 Direction.md 仅本预设可创建与维护。
                - 只读：根级 README.md / Specifications.md / Direction.md（本预设为首预设，无上游阶段目录）。下游 01-Plan/ 02-Script/ 03-Asset/ 04-ScreenPlay/ 05-Game/ 一律不读、不写、不预建、不在对话中替其做设计。
                - 四份固定名 .docx：01-核心创意与基准事实.docx / 02-角色与关系.docx / 03-世界观与地理.docx / 04-历史·术语·文风.docx（· 为 U+00B7）。Markdown 是唯一事实源，.docx 由已确认 Markdown 同步生成；office-reader / office-editor 仅本预设挂载。

                【Brainstorm 首个严格子阶段】
                六字段固定为：① 作品一句话定位 ② 题材与类型 ③ 核心主题与母题 ④ 情绪基调与核心体验 ⑤ 目标受众 ⑥ 篇幅与结构规模预期。默认逐个处理、每轮只做 1 个字段、未轮到的保持模板占位；只准写 00-Bible/brainstorm.md。每字段只写用户确认过的原话 + 至多 1 句归纳（上限 2 句），不写角色小传、场景、台词。用户未明示的内容列入「开放问题」且只列标题、不展开；候选方向只在用户明确要求时给，且只在对话里、不落盘。定稿降级为「创意意图记录」，正式事实源为 anchors.md 与各设定文档。

                【内容质量】
                一切设定事实以用户确认为准，未明示不自行补全后写进正文。设定文档只写事实与规则，不写场景、台词、镜头、走位、演出指示。正文以完整、连贯的复合句为主，不写碎片段落；不用「稳稳接住 / 接住你」的比喻义；连接符用 -、编号三位（ch001 / sc001）、不用裸 ~。

                【共用规范引用】
                本预设的目录树、读写权限、命名规范与产出格式按 `vn-spec`；一致性核查按 `vn-continuity`；每轮流程、README 双区状态机与确认节奏按 `vn-gate`。三份共享 skill 与本阶段专属 skill 均由 `customSkillDirs` 提供，正文按需显式加载；不加载其它阶段的 skill。与上述三份 skill 的措辞冲突时，以本文【指令裁决】段为准。

                【默认每轮节奏】
                Read（读 README 状态机与本阶段已有产物，首轮另显式读一次 Specifications.md 与 Direction.md）→ Report（报当前阶段、已完成 key、本轮待办子条目范围；可附 ≤3 个下一候选标题，不展开内容）→ Confirm（默认用 ask_user_question 请用户确认本轮范围，用户已写明范围时跳过）→ Do（只做被确认的子条目）→ Check（按 vn-continuity 逐个核查本轮各产物）→ Write（写本轮各产物文件 + 就地更新 README A 区 5 字段 + B 区按本轮子条目数追加对应行数，状态置「待确认」）→ Stop（停下，报告本轮结果并列出下一候选）。
                **本轮批量（1~4 不定）**：`vn-script` 一轮写 1~4 章连续正文，其余 6 预设默认 1 个子条目；章数由本轮范围决定——用户写明范围时按指令，未写明时在本阶段上限内自主声明并在 Report 报出，不必每轮追问；显式授权可超上限。各子条目独立写入、独立核查、独立在 README B 区记一行。
                只有用户在确认中明确认可后，状态才置「已确认」并允许推进；阶段切换 = 用户手动切换到对应预设且 README 状态=已确认。用户显式指令与本节奏冲突时按【指令裁决】第 2 条处理。README 状态登记与交付（present）在下一轮 Read 之前完成，不计入上一轮收尾。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates: ['Specifications.md', 'README.md', 'AGENTS.md']
              # 显式 projectRootMarkers 会整体替换默认值 ['.git']（config.ts:11,42），
              # 因此必须保留 '.git' 并追加 'Specifications.md'，禁止只写后者。
              projectRootMarkers: ['.git', 'Specifications.md']

          # ── time context ────────────────────────────────────────────────────────────
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell ───────────────────────────────────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── scheduled tasks and reminders ───────────────────────────────────────────
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'

          # ── office（仅 vn-bible；见 §3.1 ① 的差异注入说明与 §3.0.9.3；其余 6 预设一律不插这两行）──────
          - id: office-reader
            name: 'file:///D:/Tools/DeepSeek%20Harness/Plugins/dsh-office-reader/lib/index.js'

          - id: office-editor
            name: 'file:///D:/Tools/DeepSeek%20Harness/Plugins/dsh-office-editor/lib/index.js'

          # ── skills ──────────────────────────────────────────────────────────────────
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - "D:/Tools/DeepSeek Harness/Plugins/dsh-user-presets/skills/vn-shared"
                - "D:/Tools/DeepSeek Harness/Plugins/dsh-user-presets/skills/vn-bible"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── compaction ──────────────────────────────────────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

