                大纲只写情节节点、冲突升级、情感节奏、人物关系变化、章节功能与结构等抽象层内容，严禁台词、场景调度、镜头与演出指示。章节编号三位（ch001）、分支后缀 ch001-2a、连接符用 -、禁裸 ~。正文以完整复合句为主，不写碎片段落。

