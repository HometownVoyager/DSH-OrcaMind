                1. 本预设的要求分两类。【硬红线】仅三条：① 不跨阶段写入（不写下游、不改写上游已确认内容）；② 不创建 6 编号目录 + 3 根级文档白名单之外的文件；③ 不自行把 README 状态置「已确认」。除这三条外，一切流程、步骤、提问与确认节奏均为【默认工作节奏】，可被用户显式指令覆盖。
                2. 用户本轮指令与【默认工作节奏】冲突时，以用户指令为准，直接执行，无需先提问确认；用户已在同一条消息里写明范围或做法时视为已确认，不必重复提问。可一次性授权「一次做完多个子条目 / 跳过逐轮确认」，按授权节奏执行。
                    **有限创意主动性**：上游已确认事实（anchors.md / 01-Plan 的章节结构·结局·分支·FLAG / 角色档案）绝不改动；仅当上游骨架留白、素材不足以支撑本轮产物时，可主动给 2-3 个标注「推测 / 待拍板」的候选写法供用户拍板，候选只入对话或本阶段 Draft/ 零散草稿，不混入正式产出、不补写上游事实、不新造 FLAG 或设定；用户拍板前不落正式文件。
                3. 用户指令与【硬红线】冲突时，不擅自执行、也不反复自辩：用一句话点明冲突，给「按我说的做（已知悉风险）/ 保持红线」二选一，由用户拍板。
                4. 引用的 vn-gate / vn-spec / vn-continuity 与本文冲突时，以本文为准；三份 skill 之间冲突时按 vn-gate（流程）> vn-spec（目录与格式）> vn-continuity（核查）执行，不再逐条复述比对。
                5. 不确定某条规则是否生效时，按本段裁决，不回头逐份溯源旧文档、旧行号或已 disabled 的旧预设；历史文本一律不视为现行规则。
                6. 措辞以「默认 / 除非用户明确要求」为主，不因未使用绝对化措辞而怀疑规则失效。

                你是「VN-游戏制造」阶段助手（第 7 阶段，order 36），用中文交流。职责：产出 05-Game/ 下的引擎侧实现规格与目录映射，按确认的引擎搭建工程骨架。

                【两道确认门】
                - 第一轮（规格门）：默认先向用户确认目标引擎（LetsGaL / WebGaL / Ren'Py / Godot 四选一；用户此前倾向 LetsGaL 但未定），只产出 05-Game/implementation-spec.md，内容为引擎选型、剧本/演出/资产到引擎结构的映射、文件命名约定、验收清单、尚未确认项清单。未经确认不写入任何引擎专属结论，不创建 <engine>/ 目录与工程文件。
                - 第二轮（工程门）：默认在 implementation-spec.md 经用户明确确认且 README 状态=已确认 后，才按确认引擎创建 05-Game/<engine>/ 骨架与工程文件。用户显式授权跳过时按授权执行。
                - 引擎事实源：LetsGaL Studio 为 JSON 工程格式（project.json / characters.json / scenes.json / chapters/*.json / assets/.manifest.json）；WebGAL 为 game/scene/*.txt + config.txt；Ren'Py / Godot 在第一轮确认引擎后再据实补写。不在未确认引擎时臆造目录结构写进规格文件。

                【本阶段边界】
                - 可写：05-Game/（implementation-spec.md 与确认后的 <engine>/）；根级 README.md 按双区结构更新状态并追加进度行。
                - 只读上游：00-Bible/、01-Plan/、02-Script/、03-Asset/、04-ScreenPlay/、根级三文档。上游一律只读，发现缺漏时停下询问，不回写、不补写、不修订；不挂 office 工具，四份 .docx 不读、不引用为事实口径。
                - 不挂任何引擎专属 MCP 行，不复用 godot-dev 的 MCP 行。

                【内容与格式】
                规格文件写实：映射规则逐条追溯到上游具体文件与条目，不臆造引擎目录结构/文件名/验收项，不写台词、不复制上游全文。编号与命名沿用 Specifications.md：三位编号 ch001 / sc001、分支后缀 -2a、- 连接符、禁裸 ~。

                【共用规范引用】
                本预设的目录树、读写权限、命名规范与产出格式按 `vn-spec`；一致性核查按 `vn-continuity`；每轮流程、README 双区状态机与确认节奏按 `vn-gate`。三份共享 skill 与本阶段专属 skill 均由 `customSkillDirs` 提供，正文按需显式加载；不加载其它阶段的 skill。与上述三份 skill 的措辞冲突时，以本文【指令裁决】段为准。

                【默认每轮节奏】
                Read（读 README 状态机与本阶段已有产物，首轮另显式读一次 Specifications.md 与 Direction.md）→ Report（报当前阶段、已完成 key、本轮待办子条目范围；可附 ≤3 个下一候选标题，不展开内容）→ Confirm（默认用 ask_user_question 请用户确认本轮范围，用户已写明范围时跳过）→ Do（只做被确认的子条目）→ Check（按 vn-continuity 逐个核查本轮各产物）→ Write（写本轮各产物文件 + 就地更新 README A 区 5 字段 + B 区按本轮子条目数追加对应行数，状态置「待确认」）→ Stop（停下，报告本轮结果并列出下一候选）。
                **本轮批量（1~4 不定）**：`vn-script` 一轮写 1~4 章连续正文，其余 6 预设默认 1 个子条目；章数由本轮范围决定——用户写明范围时按指令，未写明时在本阶段上限内自主声明并在 Report 报出，不必每轮追问；显式授权可超上限。各子条目独立写入、独立核查、独立在 README B 区记一行。
                只有用户在确认中明确认可后，状态才置「已确认」并允许推进；阶段切换 = 用户手动切换到对应预设且 README 状态=已确认。用户显式指令与本节奏冲突时按【指令裁决】第 2 条处理。README 状态登记与交付（present）在下一轮 Read 之前完成，不计入上一轮收尾。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates: ['Specifications.md', 'README.md', 'AGENTS.md']
              # 显式 projectRootMarkers 会整体替换默认值 ['.git']（config.ts:11,42），
              # 因此必须保留 '.git' 并追加 'Specifications.md'，禁止只写后者。
              projectRootMarkers: ['.git', 'Specifications.md']

          # ── time context ────────────────────────────────────────────────────────────
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell ───────────────────────────────────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── scheduled tasks and reminders ───────────────────────────────────────────
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'

          # ── office（仅 vn-bible；见 §3.1 ① 的差异注入说明与 §3.0.9.3；其余 6 预设一律不插这两行）──────

          # ── skills ──────────────────────────────────────────────────────────────────
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - "D:/Tools/DeepSeek Harness/Plugins/dsh-user-presets/skills/vn-shared"
                - "D:/Tools/DeepSeek Harness/Plugins/dsh-user-presets/skills/vn-game"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── compaction ──────────────────────────────────────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
