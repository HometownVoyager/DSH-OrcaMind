                只有用户在确认中明确认可后，状态才置「已确认」并允许推进；阶段切换 = 用户手动切换到对应预设且 README 状态=已确认。用户显式指令与本节奏冲突时按【指令裁决】第 2 条处理。README 状态登记与交付（present）在下一轮 Read 之前完成，不计入上一轮收尾。
