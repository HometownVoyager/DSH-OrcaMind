<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>OrcaMind</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1b3d;
      color: #dbe4ff;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .card {
      max-width: 560px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 28px 32px;
    }
    h1 { font-size: 18px; margin: 0 0 14px; color: #ffb4ab; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.7;
      margin: 0 0 20px;
      opacity: 0.9;
    }
    .actions { display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      background: #2f6bff;
      color: #fff;
    }
    button.ghost { background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); }
    button:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <div class="card">
    <h1>启动失败</h1>
    <pre id="msg"></pre>
    <div class="actions">
      <button id="retry">重试启动</button>
      <button id="browser" class="ghost">在浏览器中打开</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('msg').textContent = params.get('msg') || '未知错误';
    document.getElementById('retry').addEventListener('click', () => window.desktop && window.desktop.retry());
    document.getElementById('browser').addEventListener('click', () => window.desktop && window.desktop.openBrowser());
  </script>
</body>
</html>
